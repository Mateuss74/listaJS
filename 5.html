<!DOCTYPE html>
<html>
<head>
    <title>Sorteio de Números</title>
</head>
<body>

    <h1>Sorteio de Números</h1>

    <input type="number" id="minimo" placeholder="Valor mínimo">
    <input type="number" id="maximo" placeholder="Valor máximo">

    <button onclick="sortear()">Sortear</button>

    <p id="resultado"></p>
    <ul id="lista"></ul>

    <script>
        let sorteados = [];

        function sortear() {

            let minimo = parseInt(document.getElementById("minimo").value);
            let maximo = parseInt(document.getElementById("maximo").value);

            if (isNaN(minimo) || isNaN(maximo) || minimo > maximo) {
                alert("Informe um intervalo válido!");
                return;
            }

            let numero = Math.floor(Math.random() * (maximo - minimo + 1)) + minimo;

            let encontrado = sorteados.find(item => item.numero === numero);

            if (encontrado) {
                encontrado.quantidade++;
            } else {
                sorteados.push({
                    numero: numero,
                    quantidade: 1
                });
            }

            document.getElementById("resultado").innerText =
                "Número sorteado: " + numero;

            document.getElementById("lista").innerHTML = "";

            sorteados.forEach(item => {
                document.getElementById("lista").innerHTML +=
                    "<li>" + item.numero + " - Sorteado " +
                    item.quantidade + " vez(es)</li>";
            });
        }
    </script>

</body>
</html>
