<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Desenho com Canvas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8edf3;
            text-align: center;
            padding: 25px;
        }

        h1 {
            color: #243b55;
        }

        p {
            color: #444;
        }

        canvas {
            background-color: white;
            border: 2px solid #243b55;
            border-radius: 10px;
            margin-top: 15px;
        }

        button {
            background-color: #243b55;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background-color: #42658a;
        }
    </style>

</head>

<body>

    <h1>Desenhando com JavaScript Canvas</h1>

    <p>
        Esta atividade utiliza o Canvas para criar formas geométricas
        e textos através do JavaScript.
    </p>

    <canvas id="meuCanvas" width="500" height="350"></canvas>

    <br>

    <button onclick="desenhar()">Desenhar novamente</button>

    <button onclick="limpar()">Limpar desenho</button>

    <script>

        // Seleciona o Canvas e cria o contexto 2D
        let tela = document.getElementById("meuCanvas");
        let desenho = tela.getContext("2d");

        // Função responsável pelos desenhos
        function desenhar() {

            // Limpa o conteúdo anterior
            desenho.clearRect(0, 0, tela.width, tela.height);

            // Fundo interno do desenho
            desenho.fillStyle = "#f5f8fc";
            desenho.fillRect(0, 0, 500, 350);

            // RETÂNGULO AZUL
            desenho.fillStyle = "blue";
            desenho.fillRect(50, 50, 100, 50);

            // Contorno do retângulo
            desenho.strokeStyle = "black";
            desenho.lineWidth = 2;
            desenho.strokeRect(50, 50, 100, 50);

            // CÍRCULO VERMELHO
            desenho.beginPath();
            desenho.arc(200, 150, 30, 0, Math.PI * 2);
            desenho.fillStyle = "red";
            desenho.fill();

            // Contorno do círculo
            desenho.strokeStyle = "darkred";
            desenho.stroke();

            // TRIÂNGULO VERDE EXTRA
            desenho.beginPath();
            desenho.moveTo(300, 50);
            desenho.lineTo(350, 130);
            desenho.lineTo(250, 130);
            desenho.closePath();

            desenho.fillStyle = "green";
            desenho.fill();

            // Linha horizontal
            desenho.beginPath();
            desenho.moveTo(50, 200);
            desenho.lineTo(450, 200);
            desenho.strokeStyle = "gray";
            desenho.lineWidth = 2;
            desenho.stroke();

            // TEXTO SOLICITADO
            desenho.font = "24px Arial";
            desenho.fillStyle = "black";
            desenho.fillText("Canvas!", 120, 250);

            // Texto adicional
            desenho.font = "16px Arial";
            desenho.fillStyle = "#243b55";
            desenho.fillText("Formas criadas com JavaScript", 120, 290);

            // Pequeno retângulo amarelo extra
            desenho.fillStyle = "orange";
            desenho.fillRect(350, 230, 80, 40);

            desenho.strokeStyle = "black";
            desenho.strokeRect(350, 230, 80, 40);

        }

        // Função para limpar o Canvas
        function limpar() {
            desenho.clearRect(0, 0, tela.width, tela.height);
        }

        // Executa o desenho ao abrir a página
        desenhar();

    </script>

</body>

</html>
