<!DOCTYPE html>
<html>
<head>
    <title>Mudar Cor</title>
</head>
<body>

    <h1>Mudança de Cor</h1>

    <button onclick="mudarCor()">Mudar cor</button>

    <p id="cor"></p>

    <script>
        function mudarCor() {

            let cor = "#" + Math.floor(Math.random() * 16777215)
                .toString(16).padStart(6, "0");

            document.body.style.backgroundColor = cor;

            document.getElementById("cor").innerText =
                "Cor atual: " + cor;
        }
    </script>

</body>
</html>
